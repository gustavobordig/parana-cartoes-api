<rect x="40" y="780" width="470" height="140" rx="12" fill="#fafafa" stroke="#999999" stroke-width="1.2"/>
<text x="56" y="804.0" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">Regra de score</text>
<text x="56" y="826.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">score = min(1000, renda ÷ 10)</text>
<text x="56" y="848.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• 0 – 100: negada, sem cartão</text>
<text x="56" y="870.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• 101 – 500: 1 cartão de R$ 1.000</text>
<text x="56" y="892.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• 501 – 1000: 2 cartões de R$ 5.000</text>
<rect x="540" y="780" width="520" height="140" rx="12" fill="#fafafa" stroke="#999999" stroke-width="1.2"/>
<text x="556" y="804.0" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">Resiliência nos consumers</text>
<text x="556" y="826.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• Retry exponencial: 3 novas tentativas</text>
<text x="556" y="848.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• Erro de regra: direto para a DLQ, sem retry</text>
<text x="556" y="870.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• Kill switch: pausa se 15% das mensagens falham</text>
<text x="556" y="892.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• Idempotência: índice único / _id por proposta</text>
<rect x="1090" y="780" width="490" height="140" rx="12" fill="#fafafa" stroke="#999999" stroke-width="1.2"/>
<text x="1106" y="804.0" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">Consistência e rastreio</text>
<text x="1106" y="826.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• Outbox: entidade e evento na mesma transação</text>
<text x="1106" y="848.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• Inbox: deduplica reentregas do broker</text>
<text x="1106" y="870.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• Correlation ID propagado pelos 3 serviços</text>
<text x="1106" y="892.0" font-size="14" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">• Front acompanha por GET (polling)</text>
</svg>